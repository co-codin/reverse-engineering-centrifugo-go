name: lockfile

on:
  push:
    branches: [main]
    paths:
      - "web/lockparts/READY"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the console lockfile
        run: |
          set -euo pipefail
          cat web/lockparts/b64-00 web/lockparts/b64-01 web/lockparts/b64-02 web/lockparts/b64-03 | base64 -d | gzip -d > web/package-lock.json
          echo "4f4661289d461fc2f4666db59268e0688b4db446a4370c6c3d8f88d707399da4  web/package-lock.json" | sha256sum -c
          git config user.name "co-codin"
          git config user.email "33127227+co-codin@users.noreply.github.com"
          git add web/package-lock.json
          git rm -r web/lockparts
          git commit -m "Commit the console lockfile."
          git push origin HEAD:main
