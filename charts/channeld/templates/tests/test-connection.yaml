apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "channeld.fullname" . }}-test"
  labels:
    {{- include "channeld.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
        - -qO-
        - "{{ include "channeld.fullname" . }}:{{ .Values.service.port }}/health"
